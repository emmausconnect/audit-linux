// afficher une page vide
defaultPref("browser.startup.homepage", "chrome://browser/content/blanktab.html");
defaultPref("browser.newtabpage.enabled", false);
defaultPref("browser.newtab.url", "about:blank");

// Lire le contenu DRM
defaultPref("media.eme.enabled", true);  

// demander quoi faire des fichiers
