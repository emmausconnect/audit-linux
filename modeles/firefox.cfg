// liens sponsoris&s dans les recherches
defaultPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
defaultPref("browser.urlbar.suggest.quicksuggest.sponsored", false);

// moteur de recherche par défaut
// !!! Ca change celui utilisé dans la barre de recherche, mais PAS celui affiché dans les paramètres
// On dirait que Firefox veut gêner le remplacement automatique de Google
defaultPref("browser.urlbar.placeholderName", "Qwant");
defaultPref("browser.urlbar.placeholderName.private", "Qwant");

// fermeture firefox: 
// - effacer cookies,cache
// - conserver telechargements,historique,formulaires
